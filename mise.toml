[tools]
"aqua:neovim/neovim" = "latest"
"aqua:BurntSushi/ripgrep" = "latest"
"aqua:sharkdp/fd" = { version = "latest", os = ["linux", "macos/arm64"] }
"aqua:junegunn/fzf" = "latest"
"aqua:jesseduffield/lazygit" = "latest"
"aqua:tree-sitter/tree-sitter" = "latest"
"aqua:twpayne/chezmoi" = "latest"
hunk = "latest"

# fd's latest release has no macOS x86_64 asset, so build it there.
rust = { version = "latest", profile = "minimal", os = ["macos/x64"] }
"cargo:fd-find" = { version = "latest", os = ["macos/x64"], depends = ["rust"] }
